name: Docker Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

# A tag push and a release published event can target the same commit; keep a
# single in-flight build per ref so the images are not built twice.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # GHCR requires lowercase repository names; the owner may contain capitals.
      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata for app image
        id: meta-app
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_OWNER }}/medical-inventory-app
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: app
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for webserver image
        id: meta-webserver
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_OWNER }}/medical-inventory-webserver
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and push webserver image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: webserver
          push: true
          tags: ${{ steps.meta-webserver.outputs.tags }}
          labels: ${{ steps.meta-webserver.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
