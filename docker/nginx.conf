# Docker's embedded DNS re-resolves container names so a recreated
# "app" container (new IP) never leaves nginx pointing at a dead
# upstream (the classic 502 after `docker compose up -d app`).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /app/public;
    index index.php index.html;

    client_max_body_size 20M;
    server_tokens off;

    # nginx drops these inherited headers in any location that sets its own
    # add_header, so locations below that add Cache-Control repeat them.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Vite output is already minified; gzip cuts the wire size by
    # another ~70-80% for JS/CSS/JSON/HTML. Off by default in the
    # stock nginx image.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/xhtml+xml
        image/svg+xml
        application/vnd.ms-fontobject
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # Versioned Vite build assets: hashed filenames are immutable. `^~` stops
    # the static-file regex below from claiming them.
    location ^~ /build/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Unversioned public files and user uploads (public/storage): short-lived
    # cache, since an equipment photo can be replaced under the same name.
    # Misses fall through to Laravel, which serves Livewire/Flux scripts.
    location ~* \.(?:css|js|ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|pdf)$ {
        try_files $uri /index.php?$query_string;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        set $fpm_upstream app:9000;
        fastcgi_pass $fpm_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        # PDF reports and on-demand backups can outlast the 60s default.
        fastcgi_read_timeout 300s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
