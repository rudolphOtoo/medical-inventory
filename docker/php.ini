expose_php = Off
upload_max_filesize = 20M
post_max_size = 24M
memory_limit = 256M

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16
; Application code is baked into the image and never bind-mounted, so skip
; per-request stat() calls; a container restart picks up a new image.
opcache.validate_timestamps = 0
